<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบทุนการศึกษา - เข้าสู่ระบบ</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

<style>
:root {
    --swu-red: #dd1f28;
    --swu-red-hover: #b41720;
    --bg-gray: #f0f2f5;
    --text-dark: #333333;
}

body {
  background-color: var(--bg-gray);
  font-family: 'Prompt', sans-serif;
  color: var(--text-dark);
  /* เพิ่ม padding-bottom เพื่อไม่ให้ footer ชิดขอบจอล่างเกินไปในบางหน้าจอ */
  padding-bottom: 20px; 
}

.logo {
  width: 350px; 
  display: block;
  margin: 30px auto 10px;
}
.title-text {
  text-align: center;
  font-size: 28px;
  font-weight: 425px;
  margin-top: 5px;
  color: var(--text-dark);
}

/* --- Login Card Layout --- */
.login-card {
  background: white;
  border-radius: 16px; /* เพิ่มความโค้งมนอีกนิด */
  width: 100%;
  max-width: 900px; /* 2. ขยายความกว้าง Card เพื่อรับ 2 คอลัมน์ */
  margin: 40px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  overflow: hidden; /* สำคัญ: เพื่อให้มุมภาพ slider ตัดตามขอบ card */
}

/* --- Slider (Left Column) Adjustments --- */
/* ทำให้ Slider สูงเต็มพื้นที่ของ Column */
.carousel, .carousel-inner, .carousel-item {
    height: 100%;
}

.carousel-inner img {
  /* ไม่ต้องมี border-radius เพราะใช้ overflow:hidden ที่การ์ดแม่แล้ว */
  height: 100%;     /* ดึงภาพให้สูงเต็ม */
  object-fit: cover; /* ให้ภาพครอบคลุมพื้นที่โดยไม่เสียสัดส่วน */
  width: 100%;
}

/* สำหรับหน้าจอมือถือ (เมื่อคอลัมน์ซ้อนกัน) ให้กำหนดความสูงตายตัว */
@media (max-width: 767.98px) {
    .carousel-inner img {
        height: 250px;
    }
    .login-card {
        margin-top: 20px;
        max-width: 450px; /* บนมือถือให้ card ไม่กว้างเกินไป */
    }
}

/* --- Form (Right Column) Styling --- */
.form-container {
    /* เพิ่ม padding ให้ส่วนฟอร์มดูไม่อึดอัด */
    padding: 40px;
}
@media (min-width: 768px) {
    .form-container {
         padding: 50px; /* จอใหญ่เพิ่ม padding อีกนิด */
    }
}

/* button */
.btn-login {
  background-color: var(--swu-red);
  border: none;
  padding: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
}
.btn-login:hover {
  background-color: var(--swu-red-hover);
  transform: translateY(-2px); /* effect กดปุ่มเล็กน้อย */
  box-shadow: 0 4px 10px rgba(221, 31, 40, 0.3);
}

/* input fields */
.form-control {
    padding: 12px;
    border-radius: 8px;
    border-color: #e0e0e0;
}
.form-control:focus {
    border-color: var(--swu-red);
    box-shadow: 0 0 0 0.25rem rgba(221, 31, 40, 0.25);
}
.form-label {
    font-weight: 600;
    font-size: 14px;
}

/* footer */
.footer {
  text-align: center;
  margin-top: 30px;
  padding: 20px;
  color: #888;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
    <img src="/images/swu_logo.png" class="logo" alt="SWU Logo" />

    <div class="title-text">เว็บไซต์ตรวจสอบข้อมูลการได้รับทุนการศึกษาของนิสิตนักศึกษา</div>

    <div class="login-card">
        <div class="row g-0">
            
            <div class="col-md-6 d-none d-md-block"> <div id="scholarshipCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="/images/bn_queen.jpg" alt="slide1">
                        </div>
                        <div class="carousel-item">
                            <img src="/images/bn_swu1.png" alt="slide2">
                        </div>

                    </div>
                     <button class="carousel-control-prev" type="button" data-bs-target="#scholarshipCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                      </button>
                      <button class="carousel-control-next" type="button" data-bs-target="#scholarshipCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                      </button>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-container">
                    <h3 class="text-center mb-4 fw-bold" style="color:var(--text-dark);">เข้าสู่ระบบ</h3>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">อีเมล</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" placeholder="กรอกอีเมล" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">รหัสผ่าน</label>
                             <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" placeholder="กรอกรหัสผ่าน" required />
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 text-white">เข้าสู่ระบบ</button>

                        <div class="text-center mt-4 d-flex justify-content-between font-monospace" style="font-size: 14px;">
                            <a href="/forgot" class="text-decoration-none text-secondary">ลืมรหัสผ่าน</a>
                            <a href="/register" class="text-decoration-underline fw-bold" style="color: var(--swu-red);">ลงทะเบียน</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div class="footer">
    Copyright © Srinakharinwirot University<br>
    114 Sukhumvit 23, Bangkok 10110, Thailand. E-mail : contact@g.swu.ac.th
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
