<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ลงทะเบียนสมาชิกใหม่ - ระบบทุนการศึกษา</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

<style>
:root {
    --swu-red: #dd1f28;
    --swu-red-hover: #b41720;
    --bg-gray: #f0f2f5;
    --text-dark: #333333;
}

body {
  background-color: var(--bg-gray);
  font-family: 'Prompt', sans-serif;
  color: var(--text-dark);
  padding-bottom: 20px; 
}

.logo {
  width: 300px; /* ลดขนาดลงเล็กน้อยจากหน้า login */
  display: block;
  margin: 30px auto 10px;
}
.title-text {
  text-align: center;
  font-size: 24px;
  font-weight: 400;
  margin-top: 5px;
  margin-bottom: 30px;
  color: var(--text-dark);
}

/* --- Card Layout --- */
.register-card {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 700px; /* ปรับลดความกว้างลงเนื่องจากไม่มี Slider แล้ว */
  margin: 0 auto 40px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* --- Form --- */
.form-container {
    padding: 40px;
}
@media (min-width: 768px) {
    .form-container {
         padding: 50px;
    }
}

/* Input Fields */
.form-control {
    padding: 10px 15px;
    border-radius: 8px;
    border-color: #e0e0e0;
    font-size: 14px;
}
.form-control:focus {
    border-color: var(--swu-red);
    box-shadow: 0 0 0 0.2rem rgba(221, 31, 40, 0.15);
}
.form-label {
    font-weight: 600;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
}
.input-group-text {
    border-color: #e0e0e0;
    background-color: #f9f9f9;
}

/* Button */
.btn-register {
  background-color: var(--swu-red);
  border: none;
  padding: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
  border-radius: 8px;
}
.btn-register:hover {
  background-color: var(--swu-red-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(221, 31, 40, 0.3);
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 20px;
  padding: 20px;
  color: #888;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="container">
    <img src="/images/swu_logo.png" class="logo" alt="SWU Logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Srinakharinwirot_University_Logo.png/600px-Srinakharinwirot_University_Logo.png'" />

    <div class="title-text">ลงทะเบียนเข้าใช้งานระบบทุนการศึกษา</div>

    <div class="register-card">
        <div class="row g-0">
            
            <!-- ตัดส่วน Slider (Left Side) ออกแล้ว -->

            <!-- Right Side: Registration Form (ขยายเป็น Full Width) -->
            <div class="col-12">
                <div class="form-container">
                    <h4 class="mb-4 fw-bold" style="color:var(--text-dark); border-left: 5px solid var(--swu-red); padding-left: 10px;">กรอกข้อมูลส่วนตัว</h4>

                    <form onsubmit="handleRegister(event)">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">รหัสนิสิต (Student ID) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="เช่น 6610xxxxx" required maxlength="11">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">เลขบัตรประชาชน (National ID) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="13 หลัก (ใช้ยืนยันตัวตน)" required maxlength="13">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ชื่อ (ภาษาไทย) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="ระบุชื่อจริง" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">นามสกุล (ภาษาไทย) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="ระบุนามสกุล" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">อีเมล (Email) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">รหัสผ่าน <span class="text-danger">*</span></label>
                                <input type="password" id="password" class="form-control" placeholder="อย่างน้อย 8 ตัวอักษร" required minlength="8">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ยืนยันรหัสผ่าน <span class="text-danger">*</span></label>
                                <input type="password" id="confirm_password" class="form-control" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="agree" required>
                            <label class="form-check-label small text-muted" for="agree">
                                ข้าพเจ้ายอมรับ <a href="#" class="text-decoration-none text-danger">ข้อตกลงและเงื่อนไข</a> การใช้งานระบบสารสนเทศเพื่อกิจการนิสิต
                            </label>
                        </div>

                        <button type="submit" class="btn btn-register w-100 text-white shadow-sm">ลงทะเบียน</button>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">มีบัญชีผู้ใช้งานอยู่แล้ว?</span>
                            <a href="/login" class="fw-bold text-decoration-underline ms-1" style="color: var(--swu-red);">เข้าสู่ระบบที่นี่</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
    Copyright © Srinakharinwirot University<br>
    114 Sukhumvit 23, Bangkok 10110, Thailand. E-mail : contact@g.swu.ac.th
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function handleRegister(event) {
        event.preventDefault();
        
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        if (pass !== confirm) {
            alert('รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง');
            return;
        }

        // จำลองการลงทะเบียนสำเร็จ
        alert('ลงทะเบียนสำเร็จ! กรุณาตรวจสอบอีเมลเพื่อยืนยันการใช้งาน');
        window.location.href = 'index.html'; // กลับไปหน้า Login
    }
</script>
</body>
</html>
